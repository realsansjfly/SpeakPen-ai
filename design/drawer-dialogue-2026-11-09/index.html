<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SpeakPen · 场景练习</title>
<style>
:root{font:16px/1.6 Nunito,system-ui,sans-serif;color:#21382c;background:#f8faf9;--green:#357a10;--line:#e4ebe6}
*{box-sizing:border-box}body{margin:0}button{font:inherit;cursor:pointer;color:inherit;border:0;background:transparent;min-height:48px;border-radius:14px}button:focus-visible{outline:3px solid #167ca6;outline-offset:3px}button:disabled{opacity:.5;cursor:default}button:hover{filter:brightness(.96)}::selection{background:#dcf8c6}main{max-width:520px;margin:auto;height:100dvh;display:flex;flex-direction:column}header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}header strong{font-size:20px}#content{overflow:auto;flex:1;padding:24px 20px}h1{font-size:30px;line-height:1.3;margin:0 0 28px}h2{font-size:21px;margin:28px 0 12px}p{margin:8px 0}button svg{width:22px;height:22px;vertical-align:middle}footer{padding:16px 20px;display:grid;gap:10px;border-top:1px solid var(--line);background:#f8faf9}footer button{width:100%}.primary{background:var(--green);color:white;padding:12px 18px}.outline{border:1px solid #90a18f;padding:12px 18px}.scene{width:100%;text-align:left;background:#edf8e7;padding:20px;margin-bottom:12px;display:flex;align-items:center;gap:12px}.scene>span{flex:1;min-width:0}.scene strong{font-size:21px;display:block;overflow-wrap:anywhere}.scene small{display:block;font-size:14px;color:#64756c;margin-top:8px}.roles{padding:20px;border-radius:16px;background:#21382c;color:white}.roles p:first-child{font-size:22px}.goal{display:flex;gap:12px;margin:12px 0}.goal b{color:var(--green)}.line{padding:14px 0;border-bottom:1px solid var(--line)}.line p{overflow-wrap:anywhere;font-size:17px;line-height:1.7;user-select:text}.speaker{display:flex;align-items:center;justify-content:space-between;color:#167ca6;font-weight:700;gap:10px}.speaker span{flex:1}.play{width:100%;background:#eaf6ff;color:#167ca6;padding:12px 16px}.source{font-size:13px;color:#64756c;margin:24px 0}.home{display:grid;place-items:center;min-height:60vh}.home button{min-width:200px}#scrim{position:fixed;inset:0;border-radius:0;background:#21382c66;z-index:2;touch-action:pan-y}#drawer{position:fixed;inset:0 auto 0 0;width:75vw;max-width:390px;background:#f8faf9;padding:24px 16px;z-index:3;overflow:auto;touch-action:pan-y}#drawer strong{display:block;font-size:24px;padding:12px}#drawer button{display:block;width:100%;text-align:left;padding:12px} [hidden]{display:none!important}
</style>
<main><header><button id="back" aria-label="打开菜单"></button><strong id="title"></strong></header><section id="content"></section><footer id="actions"></footer></main>
<button id="scrim" hidden aria-label="关闭抽屉"></button><aside id="drawer" hidden><strong>SpeakPen</strong><button id="close">关闭菜单</button><button id="home">主页</button><button id="scenes">场景练习</button></aside>
<script>
const source={"cafe":{"title":"Coffee Shop — Ordering a Drink","dialogue":["Customer 1: Can I have an orange juice, please?","Server: Regular or large?","Customer 1: How big is a large?","Server: This is a large. This is a regular.","Customer 1: I'll have a large, then, please. Without ice.","Server: OK, coming up.","Customer 1: Sorry, I wanted freshly squeezed orange juice.","Server: I'm afraid we only have bottled juices.","Customer 1: Oh, then I'll have an apple juice instead, please.","Server: Here you go. That's £3.50, please.","Customer: Thanks.","Server: Thank you."]},"shopping":{"title":"Shopping — Buying Clothes","dialogue":["Shop assistant: Hello, can I help you?","Customer: I'm just looking, thanks.","Customer: Excuse me?","Shop assistant: Yes?","Customer: Where are the changing rooms?","Shop assistant: They're over there. Behind you.","Customer: Thank you.","Customer: Hi. Excuse me again. Do you have this jumper in black?","Shop assistant: Yes, just a moment. What size do you need?","Customer: Extra small, please.","Shop assistant: Here you are.","Customer: How much is this?","Shop assistant: It's £29.","Customer: Can I pay by credit card?","Shop assistant: Yes, you can. Of course.","Shop assistant: Would you like a bag for that?","Customer: Yes, please."]},"directions":{"title":"Asking for Directions — Finding the Art Museum","dialogue":["Mia: Excuse me, sorry to bother you. How do I get to the art museum from here?","Gwen: Oh, you're close. Go straight down this street three blocks, then make a left at the light.","Mia: Straight three blocks, then a left at the light.","Gwen: That's it. Once you turn, it's about halfway down the block, on your right.","Ben: How will we know it when we see it?","Gwen: It's the big gray building across from the library. You really can't miss it.","Mia: And how long does that take on foot?","Gwen: Ten minutes, tops. It's a straight shot until you hit the light.","Ben: So we're headed the right way already?","Gwen: You are. Just keep going the way you're facing.","Mia: Thank you so much. You've been a big help.","Gwen: Happy to help. Enjoy the museum!"]},"hotel":{"title":"Hotel Check-in — A Reservation Mix-up","dialogue":["Guest: Hi. I have a reservation for tonight.","Hotel Clerk: And your name?","Guest: It’s Nelson. Charles Nelson.","Hotel Clerk: Okay. Mr. Nelson. Okay. That’s a room for five, and . . .","Guest: Excuse me? You mean a room for five dollars? I didn’t know the special was so good.","Hotel Clerk: No, no, no. According to our records, a room for five guests was booked under your name.","Guest: No. No. Hold on. There must be some mistake.","Hotel Clerk: Okay. Let’s check this again. Okay, Mr. Charles C. Nelson for tonight . . .","Guest: Ah. There’s the problem. My name is Charles Nelson, not Charles C. Nelson. [Oh . . .] You must have two guests under the same name.","Hotel Clerk: Okay. Let me check this again. Oh. Okay. Here we are.","Guest: Yeah.","Hotel Clerk: Charles Nelson. A room for one for the 19th . . .","Guest: Wait, wait! It was for tonight. Not tomorrow night.","Hotel Clerk: Hum. Hum. I don’t think we have any rooms for tonight. There’s a convention going on in town, and, uh, let’s see. Yeah, no rooms.","Guest: Ah come on! You must have something. Anything.","Hotel Clerk: Well. We do have some rooms under renovation with just a roll-a-way bed. None of the normal amenities like a TV or working shower or toilet.","Guest: Ah man. Come on. There must be something else.","Hotel Clerk: Well. Let, let me check my computer here. Ah!","Guest: What?","Hotel Clerk: There has been a cancellation for this evening. A honeymoon suite is now available.","Guest: Great. I’ll take it.","Hotel Clerk: But I’ll have to charge you two hundred fifty dollars for the night.","Guest: Ah. Man. I should get a discount for the inconvenience.","Hotel Clerk: Well. The best I can give you is a ten percent discount plus a ticket for a free continental breakfast.","Guest: Hey. Isn’t the breakfast free anyway?","Hotel Clerk: Well, only on weekends.","Guest: I want to talk to the manager.","Hotel Clerk: Wait, wait, wait Mr. Nelson. I think I can give you an additional 15 percent discount and I’ll throw in a free room for the next time you visit us.","Guest: That’ll be a long time."]},"campus":{"title":"Campus Socializing — Meeting Classmates","dialogue":["Teacher: So, now you've got the important information, it's time to meet each other. Everyone turn to the people next to you and introduce yourselves.","Cara: So, hi. I'm Cara. And you are?","Robert: Robert.","Selim: Selim.","Cara: Nice to meet you!","Robert and Selim: You too.","Robert: Nice accent. Where are you from?","Cara: I'm from Glasgow.","Robert: Oh, really? My mum's from near Glasgow, so I'm half Scottish.","Cara: Cool. Do you live in Scotland?","Robert: No, we live in England, near Manchester. My dad's from there. What about you, Selim?","Selim: I'm from Leeds originally but I grew up near London.","Cara: Are you both doing history on its own?","Selim: No. I'm doing history and German.","Robert: I'm doing it with maths, actually.","Selim: History and maths. That's different!","Robert: Yeah, I couldn't decide between arts and sciences. Maths doesn't help with remembering dates, though! And you?","Cara: I'm doing history and French.","Selim: I wanted to do French but German was easier, so I took that.","Cara: German is so hard!"]}};
source.interview={title:"Job Interview",dialogue:["Interviewer: Could you tell me about your background?","Candidate: I enjoy solving problems and working with others.","Interviewer: Could you give me an example?","Candidate: I helped my team plan a project and meet our deadline."]};
const entries=[["cafe","咖啡店点餐","顾客","咖啡店店员",["点一杯想要的饮品","说明甜度或牛奶偏好","确认订单并询问总价"]],["shopping","商店购物","顾客","服装店店员",["说明想买的衣物","询问尺码或颜色","确认购买决定"]],["directions","出行问路","旅行者","附近的路人",["说出目的地","询问路线","复述并确认"]],["hotel","酒店入住","已预订房间的客人","酒店前台",["说明预订姓名","询问入住安排","确认退房时间"]],["campus","校园社交","新同学","初次见面的同学",["介绍自己","询问兴趣","邀请参加活动"]],["interview","工作面试","求职者","面试官",["介绍经历","举例说明","询问岗位"]]];
const icon=(name)=>'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">'+({menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',back:'<path d="m14 5-7 7 7 7M7 12h14"/>',next:'<path d="m10 5 7 7-7 7M17 12H3"/>',sound:'<path d="m11 4-6 4H2v8h3l6 4zM15 8a6 6 0 0 1 0 8M18 5a10 10 0 0 1 0 14"/>',stop:'<rect x="5" y="5" width="14" height="14" rx="2"/>'})[name]+'</svg>';
const content=document.querySelector('#content'),actions=document.querySelector('#actions');
let screen='home',selected=0,playing=false;
function esc(v){return v.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;')}
function button(label,fn,cls='primary'){let b=document.createElement('button');b.className=cls;b.textContent=label;b.onclick=fn;return b}
function stop(){speechSynthesis.cancel();playing=false;const b=document.querySelector('#play');if(b)b.innerHTML=icon('sound')+' 播放完整对话'}
function speak(lines){stop();playing=true;const b=document.querySelector('#play');if(b)b.innerHTML=icon('stop')+' 停止播放';let i=0;const next=()=>{if(!playing)return;if(i>=lines.length){stop();return}const u=new SpeechSynthesisUtterance(lines[i++].replace(/^[^:]+: /,''));u.lang='en-GB';u.onend=next;u.onerror=stop;speechSynthesis.speak(u)};next()}
function show(next){stop();screen=next;content.innerHTML='';actions.innerHTML='';content.scrollTop=0;const e=entries[selected];document.querySelector('#title').textContent=({home:'SpeakPen',picker:'场景练习',brief:'任务简报',dialogue:'示范对话',chat:'场景对话'})[screen];document.querySelector('#back').innerHTML=icon(screen==='home'?'menu':'back');document.querySelector('#back').setAttribute('aria-label',screen==='home'?'打开菜单':'返回');
if(screen==='home'){content.innerHTML='<div class="home"><h1>聊一聊，练一练</h1></div>';actions.append(button('场景练习',()=>show('picker')))}
if(screen==='picker'){content.innerHTML='<h1>今天想练什么？</h1>';entries.forEach((v,i)=>{const b=document.createElement('button');b.className='scene';b.innerHTML='<span><strong>'+v[1]+'</strong><small>'+v[2]+' · '+v[3]+'</small></span>'+icon('next');b.onclick=()=>{selected=i;show('brief')};content.append(b)})}
if(screen==='brief'){content.innerHTML='<h1>'+e[1]+'</h1><div class="roles"><p>你：'+e[2]+'</p><p>AI：'+e[3]+'</p></div><h2>你的目标</h2>'+e[4].map((g,i)=>'<div class="goal"><b>'+(i+1)+'</b><span>'+g+'</span></div>').join('')+'<h2>对话预览</h2><p>'+esc(source[e[0]].dialogue[0])+'</p>';actions.append(button('开始对话',()=>show('chat')),button('查看完整示范',()=>show('dialogue'),'outline'))}
if(screen==='dialogue'){content.innerHTML='<h1>'+e[1]+'</h1><button class="play" id="play">'+icon('sound')+' 播放完整对话</button>';document.querySelector('#play').onclick=()=>playing?stop():speak(source[e[0]].dialogue);source[e[0]].dialogue.forEach((line,i)=>{const row=document.createElement('div');row.className='line';const pos=line.indexOf(': ');row.innerHTML='<div class="speaker"><span>'+esc(line.slice(0,pos))+'</span><button aria-label="播放第 '+(i+1)+' 句">'+icon('sound')+'</button></div><p>'+esc(line.slice(pos+2))+'</p>';row.querySelector('button').onclick=()=>speak([line]);content.append(row)});let p=document.createElement('p');p.className='source';p.textContent=e[0]==='interview'?'应用自编示范对话':'用户提供的《英语口语场景对话示例》';content.append(p);actions.append(button('开始对话',()=>show('chat')))}
if(screen==='chat'){content.innerHTML='<h1>'+e[1]+'</h1><p>此处进入正式对话。此预览不发送 AI 请求。</p>'}}
function drawer(open){document.querySelector('#scrim').hidden=!open;document.querySelector('#drawer').hidden=!open}
document.querySelector('#back').onclick=()=>screen==='home'?drawer(true):show(screen==='dialogue'?'brief':screen==='brief'?'picker':'home');
document.querySelector('#scrim').onclick=()=>drawer(false);document.querySelector('#close').onclick=()=>drawer(false);document.querySelector('#home').onclick=()=>{drawer(false);show('home')};document.querySelector('#scenes').onclick=()=>{drawer(false);show('picker')};
let start=0;for(const id of ['drawer','scrim']){let el=document.getElementById(id);el.addEventListener('touchstart',e=>start=e.touches[0].clientX,{passive:true});el.addEventListener('touchend',e=>{if(e.changedTouches[0].clientX-start < -45)drawer(false)},{passive:true})}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(!document.querySelector('#drawer').hidden)drawer(false);else document.querySelector('#back').click()}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stop()});show('home');
</script></html>
