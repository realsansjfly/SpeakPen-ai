<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>SpeakPen · 学习流程预览</title>
<style>
@font-face{font-family:Nunito;src:local('Nunito');font-display:swap}
:root{color-scheme:light;--paper:#f8faf9;--ink:#21382c;--muted:#596d61;--green:#357a10;--soft:#edf8e7;--blue:#146b91;--sky:#eaf6ff;--line:#dfe8e1;--error:#a52a28;font:16px/1.65 Nunito,'Segoe UI','Microsoft YaHei',sans-serif;background:#eaf0ec;color:var(--ink);accent-color:var(--green)}
*{box-sizing:border-box;min-width:0}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer;touch-action:manipulation}button,input,select{min-height:48px}button{border:1px solid var(--line);border-radius:14px;background:white;color:var(--ink);padding:10px 16px;transition:background .16s}button:hover{background:var(--soft)}button:disabled{cursor:default;opacity:.5}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:3px}::selection{background:#c8e9af;color:var(--ink)}input,textarea,select{width:100%;border:1px solid #a8baae;border-radius:12px;background:white;color:var(--ink);padding:12px;caret-color:var(--green)}textarea{resize:vertical;min-height:110px}input[type=checkbox]{width:24px;min-height:24px;vertical-align:middle}input[type=range]{padding:0;min-height:48px}
.app{max-width:480px;margin:auto;min-height:100dvh;background:var(--paper)}header{padding:22px 22px 10px;background:white}header strong{font-size:24px}header p{font-size:13px;color:var(--muted);margin:4px 0 12px}.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 14px 12px;background:white;scrollbar-color:#9bb3a2 white;scrollbar-width:thin}.tabs button{flex:0 0 auto;padding:9px 14px}.tabs button[aria-selected=true]{background:var(--ink);color:white;border-color:var(--ink)}main{padding:24px 22px 40px;overflow-wrap:anywhere}h1{font-size:32px;line-height:1.25;letter-spacing:-.025em;margin:8px 0 24px}h2{font-size:22px;line-height:1.4;margin:30px 0 12px}h3{font-size:18px;line-height:1.4;margin:0 0 8px}p{margin:10px 0 16px}.muted,small{color:var(--muted)}small{font-size:13px}.role{background:var(--ink);color:white;border-radius:18px;padding:22px;margin:20px 0 28px}.role p{margin:4px 0}.role strong{font-size:23px}.goals{padding-left:26px}.goals li{padding:7px 0 7px 6px}.goals li::marker{color:var(--green);font-weight:800}.sample{background:var(--sky);color:#21485f;border-radius:16px;padding:20px;margin:16px 0}.sample p:last-child{margin-bottom:0}.actions{display:flex;flex-direction:column;gap:10px;margin-top:28px}.primary{background:var(--green);color:white;border-color:var(--green);font-weight:700}.primary:hover{background:#28600c}.link{background:transparent;border-color:transparent;color:var(--green)}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button[aria-pressed=true]{background:var(--soft);border-color:var(--green);color:#275e0b;font-weight:700}.divider{border:0;border-top:1px solid var(--line);margin:26px 0}.field{display:block;margin:18px 0}.field>span{display:block;margin-bottom:7px;font-weight:600}.word{padding:24px 0;border-bottom:1px solid var(--line)}.word h2{font-size:34px;line-height:1.25;margin:0 0 6px}.word p{margin:12px 0 0}.word .meaning{font-size:19px}.word button{margin-top:14px}details{padding:14px 0;border-bottom:1px solid var(--line)}summary{cursor:pointer;min-height:48px;display:flex;align-items:center;justify-content:space-between;font-weight:600}summary:after{content:'＋';color:var(--green)}details[open]>summary:after{content:'−'}.progress{height:5px;background:#e1e9e3;border-radius:4px;margin:16px 0 26px}.progress span{display:block;height:100%;background:var(--green);border-radius:4px}.error{color:var(--error);background:#fff0ed;padding:14px;border-radius:12px}.notice{color:var(--blue);background:var(--sky);padding:14px;border-radius:12px}.queue{margin:20px 0}.segment{padding:14px 0;border-bottom:1px solid var(--line)}.segment .row button{padding:8px 12px}.user{background:#dcf8c6;border-radius:16px 4px 16px 16px;padding:16px;margin:18px 0 18px 26px}.assistant{background:white;border:1px solid var(--line);border-radius:4px 16px 16px;padding:16px;margin:18px 26px 18px 0}.options{display:grid;gap:12px}.scene-link{text-align:left;width:100%}.scene-link strong{display:block;font-size:20px}.scene-link small{display:block}label.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:20px 0}.badge{font-size:13px;color:var(--blue)}[hidden]{display:none!important}dialog{max-width:min(90vw,420px);border:0;border-radius:20px;padding:24px;color:var(--ink);background:var(--paper)}dialog::backdrop{background:#152d2380}dialog .row{margin-top:20px}output{font-variant-numeric:tabular-nums}button,.word,details{scroll-margin-block:16px}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style></head><body><div class="app"><header><strong>SpeakPen</strong><p>交互预览：录音、转写和 AI 反馈为模拟，不上传数据。</p></header><nav class="tabs" aria-label="预览模块" role="tablist"><button data-page="brief" role="tab" aria-selected="true">任务简报</button><button data-page="editor" role="tab" aria-selected="false">自建场景</button><button data-page="words" role="tab" aria-selected="false">单词本</button><button data-page="lesson" role="tab" aria-selected="false">渐进跟读</button><button data-page="topic" role="tab" aria-selected="false">话题语料</button><button data-page="voice" role="tab" aria-selected="false">多段录音</button><button data-page="settings" role="tab" aria-selected="false">词库增强</button></nav><main id="main" tabindex="-1"></main></div><dialog id="leave"><h2>放弃未保存的场景？</h2><p>已保存的场景不受影响。</p><div class="row"><button id="keep">继续编辑</button><button id="discard">放弃更改</button></div></dialog>
<script>
'use strict';
const $=s=>document.querySelector(s), main=$('#main');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const scenes=[
{name:'咖啡店点餐',user:'顾客',ai:'咖啡店店员',goals:['点一杯想要的饮品','说明甜度或牛奶偏好','确认订单并询问总价'],lines:['Customer: Can I have an orange juice, please?','Server: Regular or large?'],source:'用户提供的《英语口语场景对话示例》'},
{name:'商店购物',user:'顾客',ai:'服装店店员',goals:['说明想买的衣物','询问尺码或颜色','询问价格并明确购买决定'],lines:['Customer: Do you have this jumper in black?','Shop assistant: What size do you need?'],source:'用户提供的《英语口语场景对话示例》'},
{name:'出行问路',user:'旅行者',ai:'熟悉附近的路人',goals:['说出想去的地点','询问路线或交通方式','复述关键路线并确认'],lines:['Mia: How do I get to the art museum from here?','Gwen: Go straight down this street three blocks, then make a left at the light.'],source:'用户提供的《英语口语场景对话示例》'},
{name:'酒店入住',user:'已预订房间的客人',ai:'酒店前台',goals:['说明预订姓名及入住需求','询问早餐或退房时间','确认入住安排'],lines:['Guest: Hi. I have a reservation for tonight.','Hotel Clerk: And your name?'],source:'用户提供的《英语口语场景对话示例》',chunks:[['Guest: Hi. I have a reservation for tonight.','Hotel Clerk: And your name?'],['Guest: There must be some mistake.','Hotel Clerk: Let’s check this again.'],['Guest: Wait, wait! It was for tonight. Not tomorrow night.','Hotel Clerk: There has been a cancellation for this evening.'],['Guest: I should get a discount for the inconvenience.','Hotel Clerk: The best I can give you is a ten percent discount.']]},
{name:'校园社交',user:'新同学',ai:'初次见面的同学',goals:['介绍姓名和学习方向','询问对方兴趣','邀请一起参加活动'],lines:["Cara: So, hi. I'm Cara. And you are?","Robert: Robert."],source:'用户提供的《英语口语场景对话示例》'},
{name:'工作面试',user:'求职者',ai:'面试官',goals:['介绍相关背景','用具体例子说明能力','询问岗位问题'],lines:['Interviewer: Could you tell me about your background?','Candidate: I enjoy solving problems and working with others.'],source:'应用自编学习示例'}];
let saved={};try{saved=JSON.parse(localStorage.getItem('speakpen-learning-preview')||'{}')}catch{}
scenes.push(...(saved.customScenes||[]));
let page='brief',sceneIndex=Math.min(saved.sceneIndex||0,scenes.length-1),stage=saved.stage||0,chunk=saved.chunk||0,queue=saved.queue||[],multi=saved.multi??false,topic={purpose:'回答',count:5,difficulty:'默认'},dirty=false,pending='',recording=false,feedback='',transcript='',formal=false,replies=0;
const stages=['听示范','分句跟读','关键词替换','角色热身','正式对话'];
function save(){try{localStorage.setItem('speakpen-learning-preview',JSON.stringify({sceneIndex,stage,chunk,queue,multi,customScenes:scenes.slice(6)}))}catch{}}
function act(id,fn){const el=$('#'+id);if(el)el.onclick=fn}
function heading(text){return `<h1>${esc(text)}</h1>`}
function sample(lines){return `<div class="sample">${lines.map(s=>`<p lang="en">${esc(s)}</p>`).join('')}</div>`}
function switchPage(next){if(page==='editor'&&dirty){pending=next;$('#leave').showModal();return}page=next;render();window.scrollTo(0,0)}
document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>switchPage(b.dataset.page));
act('keep',()=>$('#leave').close());act('discard',()=>{dirty=false;$('#leave').close();page=pending;render()});
function render(){document.querySelectorAll('[data-page]').forEach(b=>b.setAttribute('aria-selected',b.dataset.page===page));main.innerHTML='';const s=scenes[sceneIndex];
if(page==='brief'){
main.innerHTML=`<label class="field"><span>场景</span><select id="scene">${scenes.map((x,i)=>`<option value="${i}" ${i===sceneIndex?'selected':''}>${x.name}</option>`).join('')}</select></label>${heading(s.name)}<div class="role"><p><strong>你：${esc(s.user)}</strong></p><p>AI：${esc(s.ai)}</p></div><h2>你的目标</h2><ol class="goals">${s.goals.map(g=>`<li>${esc(g)}</li>`).join('')}</ol><h2>示范片段</h2>${sample(s.lines)}<small>${esc(s.source)}</small><div class="actions"><button class="primary" id="learn">先学习</button><button id="direct">直接开始</button></div>`;
$('#scene').onchange=e=>{sceneIndex=Number(e.target.value);stage=0;chunk=0;save();render()};act('learn',()=>{formal=false;switchPage('lesson')});act('direct',()=>{formal=true;switchPage('lesson')});
}else if(page==='editor'){
main.innerHTML=`${heading('自建场景')}<form id="editor"><h2>情境与角色</h2><label class="field"><span>场景名称／情境</span><input name="name" maxlength="160" required></label><label class="field"><span>我的角色</span><input name="user" maxlength="160" required></label><label class="field"><span>AI 角色</span><input name="ai" maxlength="160" required></label><h2>任务目标</h2><label class="field"><span>目标清单（每行一项，最多 8 项）</span><textarea name="goals" required></textarea></label><h2>对话安排</h2><label class="field"><span>开场白（可选）</span><textarea name="opening" maxlength="1600"></textarea></label><label class="field"><span>结束条件</span><textarea name="end" maxlength="1000" required></textarea></label><label class="field"><span>轮数上限（可选）</span><input name="turns" type="number" min="1" max="100"></label><p id="editor-error" role="alert"></p><div class="actions"><button type="submit" class="primary">保存场景</button></div></form>`;
$('#editor').oninput=()=>dirty=true;$('#editor').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),goals=f.get('goals').split('\n').map(s=>s.trim()).filter(Boolean);if(!goals.length||goals.length>8||goals.some(g=>g.length>240)){$('#editor-error').textContent='请填写 1–8 项目标，每项最多 240 字。';return}scenes.push({name:f.get('name'),user:f.get('user'),ai:f.get('ai'),goals,lines:[f.get('opening')||'Hello. How can I help you?'],source:'应用自编学习示例'});sceneIndex=scenes.length-1;dirty=false;switchPage('brief')};
}else if(page==='words'){
main.innerHTML=`${heading('单词本')}<label class="field"><span>搜索单词或中文释义</span><input id="word-search" type="search"></label><div class="chips" id="levels">${['全部','四级','六级','雅思'].map((x,i)=>`<button aria-pressed="${!i}">${x}</button>`).join('')}</div><div id="word-list"></div>`;
const words=[['reservation','/ˌrezəˈveɪʃən/','n. 预订；预约','I have a reservation for tonight.','n. 保留意见；疑虑','酒店入住、餐厅订位时使用。','四级'],['accommodation','/əˌkɒməˈdeɪʃən/','n. 住处；住宿','We need accommodation near the university.','n. 调解；适应','复数 accommodations 在美式英语中也常指住宿设施。','六级'],['inconvenience','/ˌɪnkənˈviːniəns/','n. 不便；麻烦','I should get a discount for the inconvenience.','v. 给……带来不便','礼貌提出问题或请求补偿时使用。','雅思'],['interdepartmental','/ˌɪntədiːˌpɑːtˈmentəl/','adj. 部门之间的；涉及多个部门共同协调与合作的','The project requires interdepartmental cooperation.','词形：inter + departmental','长单词与长释义的布局测试示例。','六级']];let level='全部';function list(){const q=$('#word-search').value.toLowerCase();$('#word-list').innerHTML=words.filter(w=>(level==='全部'||w[6]===level)&&w.join(' ').toLowerCase().includes(q)).map(w=>`<article class="word"><h2 lang="en">${w[0]}</h2><small>${w[1]}</small><p class="meaning">${w[2]}</p><p lang="en" class="muted">${w[3]}</p><details><summary>全部义项与资料</summary><p>${w[4]}</p><p>${w[5]}</p><small>此页内容为布局示例；App 保留导入卡片的完整词典摘录及来源。</small></details></article>`).join('')||'<p>没有匹配的词，可修改搜索词重试。</p>'}list();$('#word-search').oninput=list;$('#levels').onclick=e=>{if(e.target.tagName!=='BUTTON')return;level=e.target.textContent;$('#levels').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===e.target));list()};
}else if(page==='lesson'){
if(formal){main.innerHTML=`${heading(s.name)}<p class="badge">正式对话</p><div class="assistant">${esc(s.lines[1]||s.lines[0])}</div><p>正式对话已开始。学习记录和示范没有作为用户发言发送。</p><button id="back-brief">返回简报</button>`;act('back-brief',()=>{formal=false;switchPage('brief')});return}
const chunks=s.chunks||[s.lines],lines=chunks[Math.min(chunk,chunks.length-1)];main.innerHTML=`<small>片段 ${chunk+1} / ${chunks.length}</small><div class="progress" aria-label="学习进度"><span style="width:${(stage+1)*20}%"></span></div>${heading(stages[stage])}<p>${['先听这一小段，再进入跟读。','保留原句的意思和关键表达。','替换一个关键词，例如饮品、姓名或日期。','站在你的角色，用自己的话回应对方。','学习已完成，可以开始正式对话。'][stage]}</p>${stage<4?sample(lines):''}${stage<4?'<button id="listen">听示范</button><p id="listen-state" class="muted" role="status"></p>':''}${stage>0&&stage<4?`<div class="actions"><button class="primary" id="lesson-record">模拟录音练习</button></div><label class="field"><span>转写内容（可修改）</span><textarea id="transcript">${esc(transcript)}</textarea></label><button id="feedback" ${!transcript?'disabled':''}>获取反馈</button><p id="lesson-feedback" class="notice" ${!feedback?'hidden':''}>${esc(feedback)}</p><small>反馈仅依据转写，评价意思、完整度和关键表达。</small>`:''}<p><small>${esc(s.source)}</small></p><div class="actions"><button id="next" class="primary" ${stage>0&&stage<4&&!feedback?'disabled':''}>${stage===4?'开始正式对话':'下一步'}</button><button id="previous" ${stage===0&&chunk===0?'disabled':''}>上一步</button><button class="link" id="exit-lesson">保存进度并返回</button>${stage<4?'<button class="link" id="skip">跳过学习，直接开始</button>':''}</div>`;
act('listen',()=>{$('#listen-state').textContent='示范播放交互已触发（预览不播放音频）。'});act('lesson-record',()=>{transcript=lines[0].split(': ').slice(1).join(': ');feedback='';render()});if($('#transcript'))$('#transcript').oninput=e=>{transcript=e.target.value;feedback='';$('#feedback').disabled=!transcript.trim();$('#next').disabled=true;$('#lesson-feedback').hidden=true};act('feedback',()=>{feedback='示例反馈：已表达这一片段的主要意思。可以再补上时间或具体需求，让信息更完整。';render()});act('next',()=>{if(stage===4){formal=true}else if(stage===3&&chunk+1<chunks.length){chunk++;stage=0}else stage++;feedback='';transcript='';save();render()});act('previous',()=>{if(stage===0&&chunk){chunk--;stage=3}else stage=Math.max(0,stage-1);feedback='';transcript='';save();render()});act('exit-lesson',()=>{save();switchPage('brief')});act('skip',()=>{formal=true;render()});
}else if(page==='topic'){
main.innerHTML=`${heading('话题语料')}<p class="muted">仅使用最新一轮你的消息与 AI 回答</p><div class="user">I would like an orange juice.</div><div class="assistant">Regular or large?</div><label class="toggle">模拟最新一轮未完成<input type="checkbox" id="incomplete"></label><p class="error" id="round-error" hidden>最新一轮尚未完成，请先完成转写或重试 AI 回复。</p><h2>用途</h2><div class="chips" id="purposes">${['回答','追问','泛话题相关'].map(x=>`<button aria-pressed="${topic.purpose===x}">${x}</button>`).join('')}</div><h2>数量 <output id="count-label">${topic.count}</output></h2><label><span class="muted">4–10 条</span><input id="count" type="range" min="4" max="10" value="${topic.count}" aria-label="语料数量"></label><h2>难度</h2><div class="chips" id="difficulties">${['默认','高级表达','地道表达'].map(x=>`<button aria-pressed="${topic.difficulty===x}">${x}</button>`).join('')}</div><div class="actions"><button id="generate" class="primary">生成 ${topic.count} 条语料</button></div><div id="bank"></div>`;
function chips(id,key){$('#'+id).onclick=e=>{if(e.target.tagName!=='BUTTON')return;topic[key]=e.target.textContent;$('#'+id).querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===e.target))}}chips('purposes','purpose');chips('difficulties','difficulty');$('#count').oninput=e=>{topic.count=+e.target.value;$('#count-label').textContent=topic.count;$('#generate').textContent=`生成 ${topic.count} 条语料`};$('#incomplete').onchange=e=>{$('#round-error').hidden=!e.target.checked;$('#generate').disabled=e.target.checked;$('#bank').innerHTML=''};act('generate',()=>{const banks={'回答':["I'll have a large, please.",'礼貌地选择大杯',"I'll have a large orange juice, please.",'请给我一大杯橙汁。'],'追问':['How big is a large?','先确认大杯容量，再做选择','How big is a large? I would like something to take away.','大杯有多大？我想外带。'],'泛话题相关':['freshly squeezed juice','描述现榨果汁','Do you have freshly squeezed juice today?','今天有现榨果汁吗？']},b=banks[topic.purpose];$('#bank').innerHTML=`<h2>${topic.purpose}</h2><small>布局示例，例句未加入正式对话。</small>`+Array.from({length:topic.count},(_,i)=>`<article class="word"><h3>${i+1}. ${esc(b[0])}</h3><p>${b[1]}</p><p lang="en">${b[2]}</p><small>${b[3]}</small></article>`).join('')});
}else if(page==='voice'){
main.innerHTML=`${heading('多段录音')}<label class="toggle">多段语音整合上传<input type="checkbox" id="multi" ${multi?'checked':''}></label><p class="muted">最多 6 段，总时长 3 分钟。离开页面或关闭功能后，队列仍保留。</p><div id="queue"></div><p id="queue-status" role="status"></p><div class="actions"><button id="record" class="primary" ${!multi?'disabled':''}>模拟录下一段（12 秒）</button><button id="submit" ${!queue.length?'disabled':''}>提交 ${queue.length} 段</button></div><label class="toggle">模拟下一次转写失败<input id="fail" type="checkbox"></label><div id="voice-reply"></div>`;
function drawQueue(){const total=queue.reduce((n,s)=>n+s.seconds,0);$('#queue').innerHTML=`<h2>${queue.length} 段 · ${total} 秒 / 180 秒</h2>`+queue.map((s,i)=>`<div class="segment"><strong>片段 ${i+1} · ${s.seconds} 秒</strong><p class="muted">${s.failed?'转写失败，录音已保留':s.text?'已转写':'待提交'}</p><div class="row"><button data-play="${i}">试听</button><button data-redo="${i}" ${!multi?'disabled':''}>重录</button><button data-delete="${i}">删除</button></div></div>`).join('');$('#submit').disabled=!queue.length;$('#submit').textContent=`${queue.some(s=>s.failed)?'重试并提交':'提交'} ${queue.length} 段`;$('#record').disabled=!multi||queue.length>=6||total>=180;save()}
drawQueue();$('#multi').onchange=e=>{multi=e.target.checked;drawQueue()};$('#queue').onclick=e=>{const b=e.target;if(b.dataset.play!==undefined){$('#queue-status').textContent=`正在试听片段 ${+b.dataset.play+1}（模拟）`}else if(b.dataset.redo!==undefined){queue[+b.dataset.redo]={seconds:12,text:'',failed:false};$('#queue-status').textContent='重录已替换原片段（模拟）';drawQueue()}else if(b.dataset.delete!==undefined){queue.splice(+b.dataset.delete,1);drawQueue()}};act('record',()=>{queue.push({seconds:12,text:'',failed:false});drawQueue();$('#queue-status').textContent='片段已保存在本机，尚未上传。'});act('submit',()=>{if($('#fail').checked){queue[0].failed=true;$('#fail').checked=false;$('#queue-status').className='error';$('#queue-status').textContent='片段转写失败，整个队列已保留。再次提交仅重试未成功的片段。';drawQueue();return}const n=queue.length;queue.forEach(s=>{s.text='I would like orange juice.';s.failed=false});queue=[];replies++;drawQueue();$('#queue-status').className='notice';$('#queue-status').textContent=`${n} 段已整合为 1 条用户消息。`;$('#voice-reply').innerHTML=`<div class="user">I would like a large orange juice, without ice, please.</div><div class="assistant">Of course. Anything else?</div><p>AI 回复 ${replies} 次（模拟）</p>`});
}else if(page==='settings'){
main.innerHTML=`${heading('词库增强')}<label class="toggle">关联对话词汇<input type="checkbox" id="enhance" checked></label><label class="field"><span>所选词库</span><select><option>四级 Anki 词表</option><option>六级 Anki 词表</option><option>雅思同义替换</option></select></label><div id="enhance-options"><h2>关联范围</h2><div class="chips">${['当前回合','最近对话'].map((x,i)=>`<button aria-pressed="${!!i}">${x}</button>`).join('')}</div><h2>引入强度</h2><div class="chips">${['克制','均衡','积极'].map((x,i)=>`<button aria-pressed="${i===1}">${x}</button>`).join('')}</div><h2>每轮候选</h2><div class="chips">${[4,8,12].map(x=>`<button aria-pressed="${x===8}">${x}</button>`).join('')}</div></div><hr class="divider"><p id="retrieval-status">语义关联可用（示例）</p><small>检索失败时继续使用本地筛选。</small><button class="link" id="fallback">模拟检索不可用</button>`;$('#enhance-options').querySelectorAll('.chips').forEach(g=>g.onclick=e=>{if(e.target.tagName!=='BUTTON')return;g.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===e.target))});$('#enhance').onchange=e=>$('#enhance-options').hidden=!e.target.checked;act('fallback',()=>$('#retrieval-status').textContent='暂用本地筛选，对话可以继续');
}}
render();
</script></body></html>
