<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpeakPen 话题与流动背景预览</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#edf2ef;color:#21382c;font:16px/1.55 system-ui}main{display:flex;justify-content:center;gap:32px;flex-wrap:wrap}.phone{position:relative;isolation:isolate;width:390px;height:800px;overflow:hidden;background:#f8faf9;border:1px solid #d9e4dc;border-radius:24px;display:flex;flex-direction:column}canvas{position:absolute;inset:0;z-index:-1;width:100%;height:100%}header{display:flex;align-items:center;justify-content:space-between;padding:20px;height:72px}header button{width:48px}h1{font-size:24px;margin:0}h2{font-size:26px;line-height:1.4;margin:0 0 30px}.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:0}.lane{width:100%;overflow:hidden;margin-bottom:12px}.track{display:flex;width:max-content;gap:12px;will-change:transform}.group{display:flex;gap:12px;padding-right:12px}.chip{white-space:nowrap;background:#fff;border:1px solid #e4ebe6;border-radius:16px;padding:13px 18px;font-size:15px;min-height:48px}.lane:nth-of-type(2) .chip{background:#edf8e7}.lane:nth-of-type(3) .chip{background:#eaf6ff}button{font:inherit;cursor:pointer;border:0;background:none;color:#357a10;min-height:48px;padding:10px 16px}button:focus-visible{outline:2px solid #357a10;outline-offset:2px}#refresh{margin-top:14px}.composer{background:white;border-top:1px solid #e4ebe6;padding:16px 20px;min-height:80px;display:flex;gap:12px;align-items:center}.input{border:1px solid #d8e3db;border-radius:16px;padding:10px 16px;flex:1;color:#64756c}.messages{padding:24px 20px;flex:1}.bubble{padding:14px 16px;border-radius:18px;background:white;border:1px solid #e4ebe6;max-width:88%;margin:16px 0}.user{background:#dcf8c6;border:0;margin-left:auto}.tools{display:flex;justify-content:space-evenly}.review{max-width:812px;margin:24px auto 0;color:#64756c}.review p{margin:8px 0}.review label{display:inline-flex;gap:8px;align-items:center;margin-right:18px;min-height:48px}.review input{accent-color:#357a10}svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;vertical-align:middle}::selection{background:#dcf8c6}@media(max-width:440px){body{padding:12px}.phone{width:100%;height:740px}h2{font-size:24px}}
</style>
<main>
<section class="phone"><canvas></canvas><header><button aria-label="抽屉"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1>自由聊天</h1><button id="reenter" aria-label="重新进入"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></button></header><div class="empty"><h2>今天，想聊点什么？</h2><div id="lanes"></div><button id="refresh">换一批</button><button>让 AI 先开口</button></div><div class="composer"><span class="input" id="draft">说说你的想法…</span><button aria-label="发送"><svg viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 5v15"/></svg></button></div></section>
<section class="phone"><canvas></canvas><header><button aria-label="抽屉"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><h1>自由聊天</h1><button aria-label="新对话"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></button></header><div class="messages"><div class="bubble">What would you like to do this weekend?</div><div class="bubble user">I'd like to go for a walk by the river.</div><div class="bubble">That sounds relaxing. Is there a path you like near your home?</div></div><div class="tools"><button>表达提示</button><button>话题语料</button><button>复盘</button></div><div class="composer"><span class="input">说说你的想法…</span></div></section>
</main>
<style>#lanes{width:100%;min-width:0}</style>
<aside class="review"><p>布局与动效方向预览，不是 Android 截图。</p><label><input type="checkbox" id="motion" checked>播放动效</label><label>预览时刻 <input id="time" type="range" min="0" max="30" step="0.1" value="0"></label></aside>
<script src="topics.js"></script><script>
// Scalar adaptation of Ashima Arts' MIT noise2D.glsl; full notice in the app's assets.
const mod289=x=>x-Math.floor(x/289)*289, permute=x=>mod289((x*34+10)*x);
function corner(x,y,p){let m=Math.max(.5-x*x-y*y,0);m*=m;m*=m;let q=p/41,g=2*(q-Math.floor(q))-1,h=Math.abs(g)-.5,a=g-Math.floor(g+.5);return m*(1.79284291400159-.85373472095314*(a*a+h*h))*(a*x+h*y)}
function noise(x,y){let s=(x+y)*.366025403784439,i=Math.floor(x+s),j=Math.floor(y+s),u=(i+j)*.211324865405187,x0=x-i+u,y0=y-j+u,ix=x0>y0?1:0,iy=1-ix,a=mod289(i),b=mod289(j);return Math.max(-1,Math.min(1,130*(corner(x0,y0,permute(permute(b)+a))+corner(x0-ix+.211324865405187,y0-iy+.211324865405187,permute(permute(b+iy)+a+ix))+corner(x0-.577350269189626,y0-.577350269189626,permute(permute(b+1)+a+1)))))}
let seconds=0,last=0,rendered=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
const canvases=[...document.querySelectorAll('canvas')];
window.drawAt=function(s){seconds=s;for(const canvas of canvases){let w=canvas.clientWidth,h=canvas.clientHeight;canvas.width=w;canvas.height=h;let ctx=canvas.getContext('2d');ctx.fillStyle='#f8faf9';ctx.fillRect(0,0,w,h);let t=s*.12;for(let i=0;i<4;i++){let seed=i*7.31,nx=noise(seed+t,1.8),ny=noise(seed+19.2,t*.83),b=noise(seed+t*.55,38.1),x=w*((i%2===0?.18:.82)+nx*.28),y=h*((i<2?.22:.78)+ny*.17),a=.58+b*.14,r=Math.max(w,h)*(.48+b*.08),rgb=i%2===0?'237,248,231':'234,246,255',g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,`rgba(${rgb},${a})`);g.addColorStop(.5,`rgba(${rgb},${a*.55})`);g.addColorStop(1,`rgba(${rgb},0)`);ctx.fillStyle=g;ctx.fillRect(0,0,w,h)}}};
let deck=[],previous=new Set(),batch=[],lanes=[];
const rand=()=>crypto.getRandomValues(new Uint32Array(1))[0]/4294967296;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(rand()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function refresh(){batch=[];while(batch.length<18){let n=deck.findIndex(x=>!previous.has(x.id)&&!batch.some(b=>b.id===x.id));if(n<0){deck=shuffle(TOPICS.filter(x=>!previous.has(x.id)&&!batch.some(b=>b.id===x.id)));n=0}batch.push(deck.splice(n,1)[0])}previous=new Set(batch.map(x=>x.id));document.querySelector('#lanes').innerHTML='';lanes=[];for(let i=0;i<3;i++){let lane=document.createElement('div');lane.className='lane';let track=document.createElement('div');track.className='track';for(let copy=0;copy<2;copy++){let group=document.createElement('div');group.className='group';if(copy)group.setAttribute('aria-hidden','true');for(let topic of batch.slice(i*6,i*6+6)){let chip=document.createElement('button');chip.className='chip';chip.textContent=topic.text;chip.onclick=()=>document.querySelector('#draft').textContent=topic.text;group.append(chip)}track.append(group)}lane.append(track);document.querySelector('#lanes').append(lane);let record={track,offset:track.firstChild.getBoundingClientRect().width*rand(),speed:i===1?26:32,paused:false};lane.onpointerdown=()=>record.paused=true;lane.onpointerup=()=>record.paused=false;lane.onpointercancel=()=>record.paused=false;lane.onfocusin=()=>record.paused=true;lane.onfocusout=()=>record.paused=false;lanes.push(record)}window.batchIds=batch.map(x=>x.id);updateLanes(0)}
function updateLanes(dt){for(let l of lanes){let width=l.track.firstChild.getBoundingClientRect().width;if(playing&&!l.paused)l.offset=(l.offset+dt*l.speed)%width;l.track.style.transform=`translateX(${-l.offset}px)`}}
function frame(now){let dt=rendered?(now-rendered)/1000:0;if(playing&&!document.hidden&&now-rendered>=32){window.drawAt(seconds+Math.min(dt,.08));updateLanes(Math.min(dt,.08));rendered=now}else if(!playing||document.hidden)rendered=now;requestAnimationFrame(frame)}
document.querySelector('#refresh').onclick=refresh;document.querySelector('#reenter').onclick=refresh;
document.querySelector('#motion').checked=playing;document.querySelector('#motion').onchange=e=>playing=e.target.checked;
document.querySelector('#time').oninput=e=>{playing=false;document.querySelector('#motion').checked=false;window.drawAt(Number(e.target.value))};
window.setPlaying=v=>{playing=v;document.querySelector('#motion').checked=v};
refresh();drawAt(0);requestAnimationFrame(frame);
</script></html>
