<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>SpeakPen · 开口</title><link rel="stylesheet" href="/app.css"><script type="module" src="/app.js"></script></head>
<body><main><header><div class="logo">sp</div><div class="brand"><h1>开口聊聊</h1><p id="status" role="status">正在连接千问服务…</p></div><button id="install" class="quiet">下载 App</button><button id="pair" class="quiet">连接 App</button><button id="copy-link" class="quiet">复制入口</button></header>
<section id="connect" hidden><h2>连接口语服务</h2><p>粘贴应用维护者提供的完整服务入口，无需填写模型 API Key。</p><input id="connection" type="password" placeholder="粘贴服务连接入口" autocomplete="off"><button id="connect-button">连接</button></section>
<div class="tabs"><button id="free" class="selected">自由聊</button><button id="review">练收藏</button><button id="library">复习库</button><button id="new" class="quiet">＋ 新对话</button></div>
<div id="feedback" role="alert" hidden></div>
<section id="library-panel" hidden><div class="row"><h2>把好表达留住</h2><button id="add">＋ 添加</button></div><div id="items"></div></section>
<section id="conversation"><div id="messages" aria-live="polite"></div><div id="empty"><div class="greeting">A little talk.<br>A little progress.</div><p>不必说得完美，先说一句。<br>卡住了，也可以用中文问我。</p><button id="begin">让 AI 先开口</button></div>
<div class="tools"><button id="undo" class="quiet">↶ 重说</button><button id="summarize" class="quiet">＋ 收藏好表达</button><button id="topic-expressions" class="quiet">话题语料</button><button id="display" class="quiet">显示英文原文</button></div>
<div class="composer"><div class="row"><button id="help" class="quiet">卡住了？用中文问</button><label><input id="autoplay" type="checkbox" checked> 自动朗读</label><button id="stop-speech" class="quiet">停止播放</button></div><form id="send-form"><input id="draft" placeholder="Type here, or use your voice…" autocomplete="off"><button id="send">发送</button></form><button id="hold" class="hold">按住说话</button><small>松开发送 · 上滑取消 · 语音可以重听</small><button id="retry" class="quiet" hidden>重试上一条消息</button></div></section>
<dialog id="message-actions"><h2>消息操作</h2><p id="action-description"></p><div class="action-options"><button id="identify-expression">识别好表达</button><button id="copy-message">复制</button><button id="rewrite-message">重新生成</button><button id="close-actions" class="quiet">关闭</button></div></dialog>
<dialog id="manual-entry"><h2>积累好表达</h2><p>自己记下想练的词汇、表达或话题。</p><form id="entry-form"><label>类型<select id="entry-kind"><option value="WORD">词汇</option><option value="PHRASE" selected>表达</option><option value="TOPIC">话题</option></select></label><label>英文内容<input id="entry-content" required></label><label>中文释义<input id="entry-meaning"></label><label>例句<textarea id="entry-example"></textarea></label><div class="row"><button type="submit">保存积累</button><button id="cancel-entry" type="button" class="quiet">取消</button></div></form></dialog>
<dialog id="candidates"><h2>带走几个好表达</h2><p>请确认 AI 建议，再加入复习库。</p><div id="candidate-list"></div><div class="row"><button id="save-candidates">加入复习库</button><button id="close-candidates" class="quiet">暂不收藏</button></div></dialog>
<dialog id="topic-options" aria-labelledby="topic-title"><h2 id="topic-title">话题语料</h2><p>仅使用最新一轮你的消息与 AI 回答</p><p id="topic-boundary" role="status"></p><form id="topic-form"><label>用途<select id="topic-purpose"><option value="ANSWER">回答</option><option value="FOLLOW_UP">追问</option><option value="RELATED">泛话题相关</option></select></label><label>数量 <output id="topic-count-label">5</output><input id="topic-count" type="range" min="4" max="10" step="1" value="5"></label><label>难度<select id="topic-difficulty"><option value="DEFAULT">默认</option><option value="ADVANCED">高级表达</option><option value="IDIOMATIC">地道表达</option></select></label><div class="row"><button id="topic-generate" type="submit">生成语料</button><button id="topic-cancel" type="button" class="quiet">取消</button></div></form></dialog>
<footer>文字与语音通过应用服务处理</footer></main></body></html>
